services:
  postgres:
    image: postgres:17-alpine
    container_name: bet-api-postgres
    environment:
      POSTGRES_DB: bet_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bet_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
